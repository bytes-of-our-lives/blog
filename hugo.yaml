# Hugo configuration file
#
# See all settings at <https://gohugo.io/configuration/all/>.

# The title of your site, displayed in the browser title bar and header.
title: "Bytes of our Lives 👾"

# The absolute URL of your published site including the protocol, host, path, and a trailing slash.
# Uncomment when using a custom domain.
# baseURL: https://example.org/

# The site’s locale, conforming to the syntax described in RFC 5646.
locale: en-US

taxonomies:
  author: authors
  category: categories
  tag: tags

menus:
  main:
    - name: Articles
      pageRef: /posts
      weight: 10
    - name: Authors
      pageRef: /authors
      weight: 20

# Configure modules (themes, plugins, etc.) for Hugo.
module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

params:
  homeInfoParams:
    Title: Sharing ideas and telling stories about software systems and startup life
    Content: |
      Drawing on our different experiences in high tech, we write about the work of building products, teams, and companies.

      We hope you find it practical, witty, and relatable.
