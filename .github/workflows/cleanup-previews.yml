name: 🧹 Retire Review Sites

on:
  push:
    branches: [codex/preview-cleanup]

concurrency:
  group: preview-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview
      deployment: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare disposable preview
        run: |
          mkdir -p "$RUNNER_TEMP/cleanup-check"
          printf '<!doctype html><title>Preview cleanup check</title>\n' > "$RUNNER_TEMP/cleanup-check/index.html"

      - name: Publish disposable revisions
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ github.token }}
          command: |
            pages deploy ${{ runner.temp }}/cleanup-check --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=cleanup-action-check
            pages deploy ${{ runner.temp }}/cleanup-check --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=cleanup-action-check

      - name: Remove disposable Cloudflare revisions
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PREVIEW_BRANCH: cleanup-action-check
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deployment list --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --environment=preview --json
          postCommands: bash .github/scripts/cleanup-previews.sh

      - name: Remove disposable GitHub deployments
        uses: strumwolf/delete-deployment-environment@035f6d27c8b8951729f4d71b2d3d6a7975139476 # v4.0.0
        with:
          token: ${{ github.token }}
          environment: preview
          ref: ${{ github.ref_name }}
          onlyRemoveDeployments: true
