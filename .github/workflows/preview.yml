# ─────────────────────
# Pull Request Previews
# ─────────────────────
name: 🔎 Review Sites

on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize, closed]

# Each pull request owns one stable preview alias. A newer revision supersedes
# any deployment still running for that pull request.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  preview:
    # Environment credentials are unavailable to forks and Dependabot.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    outputs:
      deployment_id: ${{ steps.deployment.outputs.pages-deployment-id }}
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview
      # Wrangler creates the Deployment that represents the actual preview.
      deployment: false
    runs-on: ubuntu-latest
    steps:
      - name: Validate preview configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure CLOUDFLARE_ACCOUNT_ID in the preview environment}"
          : "${CLOUDFLARE_API_TOKEN:?Configure CLOUDFLARE_API_TOKEN in the preview environment}"
          : "${CLOUDFLARE_PAGES_PROJECT:?Configure CLOUDFLARE_PAGES_PROJECT in the preview environment}"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Hugo uses Git history for .GitInfo, .LastMod, and enableGitInfo.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false

      - name: Hugo setup
        uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo site
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          # Draft and future content is unpublished, not confidential. Pull
          # request previews render both so reviewers can inspect it.
          hugo \
            --buildDrafts \
            --buildFuture \
            --minify \
            --baseURL /

      - name: Deploy preview
        id: deployment
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ github.token }}
          command: >-
            pages deploy public
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=pr-${{ github.event.pull_request.number }}

  cleanup:
    needs: preview
    if: >-
      always() &&
      (github.event.action == 'closed' || needs.preview.result == 'success') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      deployments: write
    environment:
      name: preview
      deployment: false
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete preview deployments
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          KEEP_DEPLOYMENT_ID: ${{ needs.preview.outputs.deployment_id }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const closed = context.payload.action === 'closed';
            const keep = process.env.KEEP_DEPLOYMENT_ID;
            if (!closed && !keep) throw new Error('Missing new preview deployment ID');
            const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/${process.env.CLOUDFLARE_PAGES_PROJECT}/deployments`;
            async function cloudflare(url, method = 'GET') {
              const response = await fetch(url, { method, headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } });
              const data = await response.json();
              if (!response.ok || !data.success) throw new Error(JSON.stringify(data.errors));
              return data;
            }
            const previews = [];
            for (let page = 1; ; page++) {
              const data = await cloudflare(`${endpoint}?env=preview&per_page=25&page=${page}`);
              previews.push(...data.result);
              if (page >= data.result_info.total_pages) break;
            }
            for (const deployment of previews.filter(d => d.environment === 'preview' && d.deployment_trigger.metadata.branch === `pr-${pr.number}` && d.id !== keep)) {
              await cloudflare(`${endpoint}/${deployment.id}?force=true`, 'DELETE');
              core.info(`Deleted Cloudflare preview ${deployment.id}`);
            }
            const records = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo, environment: 'preview', ref: pr.head.ref,
            });
            for (const deployment of records.slice(closed ? 0 : 1)) {
              await github.rest.repos.createDeploymentStatus({ ...context.repo, deployment_id: deployment.id, state: 'inactive', auto_inactive: false });
              await github.rest.repos.deleteDeployment({ ...context.repo, deployment_id: deployment.id });
              core.info(`Deleted GitHub preview ${deployment.id}`);
            }
