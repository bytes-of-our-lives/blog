# ─────────────────────
# Pull Request Previews
# ─────────────────────
name: 🔎 Review Sites

on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize, closed]

# Each pull request owns one stable preview alias. A newer revision supersedes
# any deployment still running for that pull request.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  preview:
    # Environment credentials are unavailable to forks and Dependabot.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview
      # Wrangler creates the Deployment that represents the actual preview.
      deployment: false
    runs-on: ubuntu-latest
    steps:
      - name: Validate preview configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure CLOUDFLARE_ACCOUNT_ID in the preview environment}"
          : "${CLOUDFLARE_API_TOKEN:?Configure CLOUDFLARE_API_TOKEN in the preview environment}"
          : "${CLOUDFLARE_PAGES_PROJECT:?Configure CLOUDFLARE_PAGES_PROJECT in the preview environment}"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Hugo uses Git history for .GitInfo, .LastMod, and enableGitInfo.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false

      - name: Hugo setup
        uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Hugo site
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          # Draft and future content is unpublished, not confidential. Pull
          # request previews render both so reviewers can inspect it.
          hugo \
            --buildDrafts \
            --buildFuture \
            --minify \
            --baseURL /

      - name: Remove previous GitHub preview records
        uses: strumwolf/delete-deployment-environment@035f6d27c8b8951729f4d71b2d3d6a7975139476 # v4.0.0
        with:
          token: ${{ github.token }}
          environment: preview
          ref: ${{ github.event.pull_request.head.ref }}
          onlyRemoveDeployments: true

      - name: Deploy preview
        id: deployment
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ github.token }}
          command: >-
            pages deploy public
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=pr-${{ github.event.pull_request.number }}

      - name: Remove obsolete Cloudflare preview revisions
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
          KEEP_DEPLOYMENT_ID: ${{ steps.deployment.outputs.pages-deployment-id }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deployment list --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --environment=preview --json
          postCommands: |
            test -n "$KEEP_DEPLOYMENT_ID"
            bash .github/scripts/cleanup-previews.sh

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview
      deployment: false
    runs-on: ubuntu-latest
    steps:
      - name: Validate preview configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure CLOUDFLARE_ACCOUNT_ID in the preview environment}"
          : "${CLOUDFLARE_API_TOKEN:?Configure CLOUDFLARE_API_TOKEN in the preview environment}"
          : "${CLOUDFLARE_PAGES_PROJECT:?Configure CLOUDFLARE_PAGES_PROJECT in the preview environment}"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Remove GitHub preview records
        uses: strumwolf/delete-deployment-environment@035f6d27c8b8951729f4d71b2d3d6a7975139476 # v4.0.0
        with:
          token: ${{ github.token }}
          environment: preview
          ref: ${{ github.event.pull_request.head.ref }}
          onlyRemoveDeployments: true

      - name: Remove Cloudflare preview revisions
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deployment list --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --environment=preview --json
          postCommands: bash .github/scripts/cleanup-previews.sh
